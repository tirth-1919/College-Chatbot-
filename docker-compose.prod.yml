# Production Docker Compose Configuration
# Complete multi-service orchestration with network segmentation and resource constraints

version: "3.9"

services:
  # In-Memory Cache & Asynchronous Broker
  redis:
    image: redis:7-alpine
    container_name: college_chatbot_prod_redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-changethisinproduction}
    volumes:
      - redis_prod_data:/data
    networks:
      - data-net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changethisinproduction}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: college_chatbot_prod_backend
    restart: always
    expose:
      - "8000"
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - ENVIRONMENT=production
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changethisinproduction}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-changethisinproduction}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-changethisinproduction}@redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend-net
      - data-net
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Celery Async Background Worker (Crawling, OCR, Document Ingestion, Embeddings)
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: college_chatbot_prod_worker
    restart: always
    command: celery -A app.workers.celery_app.celery worker --loglevel=info -c 4 --without-gossip --without-mingle
    env_file:
      - ./backend/.env
    environment:
      - ENVIRONMENT=production
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changethisinproduction}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-changethisinproduction}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-changethisinproduction}@redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - backend-net
      - data-net
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # Celery Beat Periodic Task Scheduler
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: college_chatbot_prod_beat
    restart: always
    command: celery -A app.workers.celery_app.celery beat --loglevel=info
    env_file:
      - ./backend/.env
    environment:
      - ENVIRONMENT=production
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changethisinproduction}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-changethisinproduction}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-changethisinproduction}@redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - data-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # Next.js User-Facing Student Portal
  user-frontend:
    build:
      context: ./apps/user-frontend
      dockerfile: Dockerfile
    container_name: college_chatbot_prod_user_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:8000/api/v1
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - frontend-net
      - backend-net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Next.js College & Super Admin Portal
  admin-frontend:
    build:
      context: ./apps/admin-frontend
      dockerfile: Dockerfile
    container_name: college_chatbot_prod_admin_frontend
    restart: always
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:8000/api/v1
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - frontend-net
      - backend-net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
  data-net:
    driver: bridge
    internal: true # Redis is kept strictly on internal network, isolated from public interface

volumes:
  redis_prod_data:

