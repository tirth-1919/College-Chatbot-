<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="AI FAQ College Chat Bot logo">
  <defs>
    <linearGradient id="capGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C7D6F5"/>
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCE6FA"/>
    </linearGradient>
  </defs>

  <g transform="translate(110,0) scale(1.0)">
    <!-- Graduation cap -->
    <g fill="url(#capGrad)">
      <path d="M130 12 L190 40 L130 68 L70 40 Z"/>
      <path d="M162 50 v22 a4 4 0 0 1 -8 0 V54 Z"/>
      <circle cx="162" cy="78" r="6"/>
      <path d="M158 82 h8 l3 22 a7 7 0 0 1 -14 0 Z"/>
    </g>
    <!-- Chat bubble -->
    <path fill="url(#bubbleGrad)" d="M106 44 h48 a16 16 0 0 1 16 16 v28 a16 16 0 0 1 -16 16 h-26 l-14 14 v-14 h-8 a16 16 0 0 1 -16 -16 V60 a16 16 0 0 1 16 -16 Z"/>
    <path fill="#000000" d="M110 58 h40 a8 8 0 0 1 8 8 v20 a8 8 0 0 1 -8 8 h-20 l-10 10 v-10 h-10 a8 8 0 0 1 -8 -8 V66 a8 8 0 0 1 8 -8 Z"/>
    <circle cx="118" cy="76" r="6" fill="#2F7CF6"/>
    <circle cx="134" cy="76" r="6" fill="#2F7CF6"/>
    <circle cx="150" cy="76" r="6" fill="#2F7CF6"/>
  </g>

  <!-- Wordmark: AI FAQ -->
  <text x="100" y="235" font-family="Poppins, Inter, sans-serif" font-size="96" font-weight="700">
    <tspan fill="#2F7CF6">AI</tspan><tspan fill="#FFFFFF" dx="16">FAQ</tspan>
  </text>

  <!-- Tagline -->
  <text x="102" y="300" font-family="Poppins, Inter, sans-serif" font-size="44" font-weight="500" fill="#FFFFFF">College Chat Bot</text>
</svg>