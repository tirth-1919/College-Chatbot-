name: Continuous Integration (CI)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-qa:
    name: Backend Security, Lint & Unit Tests
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng libpq-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio pytest-cov flake8 bandit

      - name: Security Vulnerability Scan (Bandit)
        run: |
          bandit -r backend/app -ll -ii || true

      - name: Run Backend Pytest Suite
        env:
          PYTHONPATH: backend
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test-ci-secret-key-01234567890123456789012345678901
          ENVIRONMENT: test
        run: |
          pytest backend/tests -v --maxfail=1

  frontend-qa:
    name: Next.js Frontends Lint & Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            apps/user-frontend/package.json
            apps/admin-frontend/package.json

      - name: Build User Frontend
        working-directory: apps/user-frontend
        run: |
          npm ci || npm install
          npm run build

      - name: Build Admin Frontend
        working-directory: apps/admin-frontend
        run: |
          npm ci || npm install
          npm run build

  docker-lint-build:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    needs: [backend-qa, frontend-qa]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: college-chatbot-backend:test

      - name: Build User Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/user-frontend
          push: false
          tags: college-chatbot-user-frontend:test

      - name: Build Admin Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/admin-frontend
          push: false
          tags: college-chatbot-admin-frontend:test

